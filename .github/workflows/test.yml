name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install numpy PyQt6 rdkit

      - name: Install Linux GUI libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0

      - name: Clone the main MoleditPy application
        # Without this the API compatibility test skips instead of running.
        run: git clone --depth 1 https://github.com/HiroYokoyama/python_molecular_editor.git ../python_molecular_editor

      - name: Clone ReShiki for the real-file parity test
        run: git clone --depth 1 https://github.com/Ameyanagi/ReShiki.git ../ReShiki

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
          MOLEDITPY_HEADLESS: "1"
        run: python -m pytest tests/ -v --cov=reshiki_importer.py --cov-report=term-missing
